[package]
name = "arqus"
version = "0.2.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
futures-util = "0.3.34"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "2.0.1"
tokio = { version = "1.54.1", features = ["full"] }
unicode-width = "0.2.3"
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
lto = "thin"

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
